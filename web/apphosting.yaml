# Firebase App Hosting backend configuration for the TMS web app.
# Create the backend with `firebase apphosting:backends:create` and point its root directory at `web/`.
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: tms-firebase-api-key
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ihm-tms-prod.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ihm-tms-prod
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ihm-tms-prod.appspot.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: tms-firebase-app-id
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  # Same-origin API: the browser calls /api/v1/*, Next.js proxies to the Cloud Function.
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: API_PROXY_ORIGIN
    value: https://europe-west1-ihm-tms-prod.cloudfunctions.net/api
    availability: [BUILD, RUNTIME]
